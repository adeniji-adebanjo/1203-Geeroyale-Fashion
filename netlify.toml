# Netlify build configuration
#
# `publish` must be set explicitly: with no value Netlify defaults it to the
# repo root, and @netlify/plugin-nextjs rejects a publish directory equal to the
# base directory ("Your publish directory cannot be the same as the base
# directory of your site"), so the build succeeded but nothing was ever
# published. The Next.js Runtime expects `.next`.
#
# Node is pinned because Next 16 requires >= 20.9.0 and older Netlify sites
# still default to Node 18.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

# Long-cache the fingerprinted build assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
